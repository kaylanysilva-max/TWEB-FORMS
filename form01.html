<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscrição nos jogos escolares</title>
</head>
<body>
<header>
<h1>Inscrição nos jogos escolares</h1>
Preencha os campos abaixo com suas informações.
</header>
<main>
<form id="inscrição-jogos" action="/inscrições-jogos" method="post" enctype="multipart/form-data">
   <fieldset>
     <legend>1. Identificação do atleta</legend>
      <label for="nome-atleta">Nome completo do atleta (obrigatório)</label>
<input type="text" id="nome-atleta" name="nome_atleta" required><br></br>
 <label for="nome-social">Nome social</label>
      <input type="text" id="nome-social" name="nome_social" required><br></br> 
       <label for="nome-Matrícula">Matrícula (Obrigatório)</label>
      <input type="text" id="nome-Matrícula" name="nome_Matrícula" required><br></br>
        <label for="data-nascimento">Data de nascimento</label>
      <input type="date" id="data-nasc" name="data_nascimento" required><br></br>
      <label for="email-atleta"> Email de contato (Obrigatório)</label>
  <input type="email" id="email-atleta" name="email_atleta" required><br></br>
       <label for="telefone">Telefone de contato</label>
  <input type="tel" id="telefone" name="telefone" required><br></br>
       <label for="site-escola">Site da escola</label>
  <input type="url" id="site-escole" name="site_escola" value="https://escola.exemplo">
   </fieldset>
   
    <fieldset>
    <legend>2. Escola e delegação</legend>
      <label for="escola-origem">Escola de origem</label>
  <select id="escola-origem" name="escola_origem" >
     <option value="Escola Aurora">Escola Aurora</option>
      <option value="Escola Gomes">Escola Gomes</option>
      <option value="Escola Ferreira">Escola Ferreira</option>
  </select><br></br>
  </fieldset>
   
  <label for="equipe">Nome da equipe</label>
<input type="text" id="equipe" name="equipe" value="Equipe Horizonte">

   <fieldset>
<legend>Turno de preferência</legend>
<input type="radio" id="turno-manha" name="turno" value="manha">
<label for="turno-manha">Manhã</label>
<input type="radio" id="turno-tarde" name="turno" value="tarde">
<label for="turno-tarde">Tarde</label>
</fieldset>

   <fieldset>
<legend>Modalidades de interesse</legend>
<input type="checkbox" id="interesse-futsal"
name="modalidades" value="futsal">
<label for="interesse-futsal">Futsal</label>
<input type="checkbox" id="interesse-volei"
name="modalidades" value="voleibol">
<label for="interesse-volei">Voleibol</label>
</fieldset>
   
</form>
</main>
</body>
</html>
